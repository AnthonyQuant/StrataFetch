<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrataFetch - Student Opportunity Hub</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        .opp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .opp-card {
            background-color: #111827;
            border: 1px solid #1f293d;
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.75rem;
        }
        .opp-tag {
            align-self: flex-start;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .tag-internship { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .tag-scholarship { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag-fellowship { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .tag-research { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .opp-title { font-size: 1.1rem; color: #f8fafc; font-weight: 600; }
        .opp-org { font-size: 0.85rem; color: #94a3b8; }
        .opp-meta { font-size: 0.8rem; color: #64748b; display: flex; justify-content: space-between; }
        .filter-bar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
        .filter-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .filter-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    </style>
</head>
<body class="dark-theme">
    <div class="dashboard-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-icon">⚡</span>
                <h2>StrataFetch</h2>
            </div>

            <nav class="nav-menu">
                <a href="/" class="nav-item"><span class="icon">📊</span> Dashboard</a>
                <a href="/selector-builder" class="nav-item"><span class="icon">🎯</span> Visual Selector</a>
                <a href="/opportunities" class="nav-item active"><span class="icon">🎓</span> Opportunity Hub</a>
                <a href="/docs" target="_blank" class="nav-item"><span class="icon">⚡</span> API Docs</a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div>
                    <h2>Student & Career Opportunity Hub</h2>
                    <span class="breadcrumbs">Live Scraped Internships, Scholarships & Fellowships</span>
                </div>
                <div class="header-actions">
                    <input type="text" id="opp-search" class="search-box" style="padding:0.5rem; background:#111827; border:1px solid #1f293d; color:#fff; border-radius:6px;" placeholder="Search title, organization, criteria...">
                </div>
            </header>

            <!-- Filter Buttons -->
            <div class="filter-bar">
                <button class="filter-btn active" data-category="">All Categories</button>
                <button class="filter-btn" data-category="internship">Internships</button>
                <button class="filter-btn" data-category="scholarship">Scholarships</button>
                <button class="filter-btn" data-category="fellowship">Fellowships</button>
                <button class="filter-btn" data-category="research">Research</button>
                <button class="filter-btn" data-category="graduate_program">Graduate Programs</button>
            </div>

            <!-- Opportunities Grid -->
            <div class="opp-grid" id="opportunities-container">
                <div style="color: #94a3b8;">Loading opportunities...</div>
            </div>
        </main>
    </div>

    <script src="/static/js/opportunities.js"></script>
</body>
</html>
